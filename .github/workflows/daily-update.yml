name: Daily market and news update

on:
  workflow_dispatch:
  schedule:
    # 09:15 Singapore time (01:15 UTC), weekdays
    - cron: '15 1 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update-and-deploy
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch prices and news
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'chore: update market and news data'
            git push
          fi

      # Important: GITHUB_TOKEN pushes do not themselves trigger a second
      # Pages workflow. Deploy explicitly from this same run.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
